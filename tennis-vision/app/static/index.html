<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tracer Tennis">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#060f2b">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<link rel="icon" type="image/png" href="/static/icon-192.png">
<title>Tracer Tennis</title>
<style>
:root {
  --bg: #f4f6fb; --card: #ffffff; --ink: #060f2b; --muted: #5a6480; --line: #e1e6f1; --soft: #eef2fa;
  --accent: #005efd; --accent-ink: #ffffff; --accent-soft: #e6efff;
  --good: #0f8a5f; --good-soft: #e3f5ee; --ok: #b26a00; --ok-soft: #fdf1dc; --work: #d4380d; --work-soft: #fdebe4; --info: #7a859e;
  --chip: #e9eef8; --court: #2f6b4a; --court-line: #f5f7f2; --head: #060f2b; --head-link: #9cc0ff;
  --shadow: 0 1px 2px rgba(6, 15, 43, .05), 0 8px 24px rgba(6, 15, 43, .06);
  --hero: linear-gradient(140deg, #060f2b 0%, #0a1f55 55%, #0b3fae 115%);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #050b20; --card: #0d1838; --ink: #eef2fb; --muted: #98a4c4; --line: #1c2950; --soft: #132046;
    --accent: #3d86ff; --accent-ink: #ffffff; --accent-soft: #12275a;
    --good: #3fd39a; --good-soft: #0e3a30; --ok: #f0b656; --ok-soft: #3a2c10; --work: #ff8a63; --work-soft: #40190f; --info: #8c97b5;
    --chip: #17244c; --court: #265c40; --court-line: #dfe8e1;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .28);
    --hero: linear-gradient(140deg, #0a1638 0%, #0c2566 55%, #1250d8 120%);
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased;
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--head);
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px; display: flex; align-items: center; justify-content: space-between; }
header a.brand { display: flex; align-items: center; gap: 6px; text-decoration: none; }
header a.brand img { display: block; height: 34px; width: auto; }
header a.brand img.word { height: 30px; }
header nav a { color: var(--head-link); text-decoration: none; font-weight: 600; margin-left: 12px; font-size: 15px; }
main { max-width: 720px; margin: 0 auto; padding: 18px 16px calc(48px + env(safe-area-inset-bottom)); }
h1 { font-size: 27px; line-height: 1.15; margin: 6px 0 6px; letter-spacing: -0.025em; font-weight: 800; }
h2 { font-size: 19px; margin: 34px 0 12px; letter-spacing: -0.015em; font-weight: 750; }
h3 { font-size: 16px; margin: 0 0 6px; font-weight: 700; letter-spacing: -0.01em; }
p { margin: 6px 0; }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }
.eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin: 12px 0; box-shadow: var(--shadow); }
a.card { display: block; color: inherit; text-decoration: none; transition: transform .12s ease; }
a.card:active { transform: scale(0.985); }
.card .big { font-size: 18px; font-weight: 750; letter-spacing: -0.01em; }
.row { display: flex; gap: 10px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.spread { justify-content: space-between; }
label { display: block; font-weight: 650; font-size: 14px; margin: 16px 0 6px; }
input[type=text], input[type=number], select { width: 100%; font: inherit; color: var(--ink); background: var(--card);
  border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; min-height: 48px; }
input[type=text]:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
input[type=file] { width: 100%; font: inherit; color: var(--muted); padding: 14px; border: 1.5px dashed var(--line); border-radius: 14px; background: var(--card); }
button, .btn { font: inherit; font-weight: 700; border: 0; border-radius: 14px; padding: 13px 18px; min-height: 48px;
  background: var(--accent); color: var(--accent-ink); cursor: pointer; letter-spacing: -0.005em; }
button:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.ghost { background: var(--chip); color: var(--ink); }
button.small { min-height: 36px; padding: 6px 13px; border-radius: 999px; font-size: 14px; font-weight: 650; }
button:disabled { opacity: 0.5; }
button.on { background: var(--accent); color: var(--accent-ink); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--chip); padding: 4px; border-radius: 14px; }
.seg button { background: transparent; color: var(--ink); min-height: 40px; padding: 8px 10px; border-radius: 11px; font-weight: 650; }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(6, 15, 43, .18); outline: 0; }
.chip { display: inline-block; background: var(--chip); border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 650; }
.chip.warn { background: var(--work-soft); color: var(--work); }
video, img.frame { width: 100%; border-radius: 16px; background: #000; display: block; }
.strip { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x mandatory; }
.strip figure { margin: 0; flex: 0 0 44%; scroll-snap-align: start; }
.strip img { width: 100%; border-radius: 12px; display: block; }
.strip figcaption { font-size: 12.5px; color: var(--muted); text-align: center; margin-top: 4px; font-weight: 600; }
.bar { height: 8px; background: var(--chip); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .5s ease; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex: 0 0 10px; }
.s-good { background: var(--good); } .s-ok { background: var(--ok); } .s-work { background: var(--work); } .s-info { background: var(--info); }
.metric { padding: 10px 0; border-top: 1px solid var(--line); }
.metric:first-of-type { border-top: 0; }
.metric .val { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; max-width: 45%; }
.metric .lab { flex: 1; min-width: 0; }
.metric .row, .metric.row { align-items: flex-start; }
.metric .dot { margin-top: 7px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 650; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; border-top: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
table.tight { font-size: 13px; }
table.tight th, table.tight td { padding: 6px 3px; }
table.tight th { letter-spacing: 0; font-size: 11px; }
.scroll { overflow-x: auto; }
.shot { display: flex; gap: 10px; align-items: baseline; padding: 10px 0; border-top: 1px solid var(--line); cursor: pointer; }
.shot .t { color: var(--muted); font-variant-numeric: tabular-nums; width: 52px; flex: 0 0 52px; font-size: 13px; }
.rec { border-left: 4px solid var(--accent); }
.rec.p1 { border-left-color: var(--work); } .rec.p2 { border-left-color: var(--ok); }
.err { color: var(--work); font-weight: 600; }
canvas.pick { width: 100%; border-radius: 14px; touch-action: manipulation; display: block; background: #000; }
svg { display: block; width: 100%; height: auto; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 420px) { .grid2 { grid-template-columns: 1fr; } }
.hide { display: none !important; }

/* hero */
.hero { background: var(--hero); color: #fff; border-radius: 22px; padding: 20px; margin: 4px 0 14px; box-shadow: var(--shadow); }
.hero h1 { color: #fff; margin: 2px 0 2px; }
.hero .eyebrow { color: #9cc0ff; }
.hero .meta { color: #c3d3f5; font-size: 13.5px; }
.hero .top { display: flex; gap: 16px; align-items: center; }
.hero .headline { font-size: 17px; font-weight: 650; line-height: 1.35; margin-top: 14px; }
.hero .context { color: #c3d3f5; font-size: 13.5px; margin-top: 8px; }
.ring { position: relative; width: 104px; height: 104px; flex: 0 0 104px; }
.ring svg { transform: rotate(-90deg); }
.ring .num { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring .num b { font-size: 34px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
.ring .num span { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #9cc0ff; margin-top: 3px; }
.ring circle.fill { transition: stroke-dashoffset .9s cubic-bezier(.2, .8, .2, 1); }
.homehero { background: var(--hero); color: #fff; border-radius: 22px; padding: 22px 20px; margin: 2px 0 16px; box-shadow: var(--shadow); }
.homehero h1 { color: #fff; font-size: 26px; }
.homehero p { color: #c3d3f5; max-width: 34ch; }
a.card.mode { display: flex; gap: 14px; align-items: center; }
.mode .ico { width: 46px; height: 46px; flex: 0 0 46px; border-radius: 14px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.mode .ico svg { width: 26px; height: 26px; }
.mode .txt { flex: 1; min-width: 0; }
.mode .go { color: var(--muted); font-size: 22px; line-height: 1; }

/* video tools */
.hud { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 8px; margin-top: 10px; }
.hud > div { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 9px 12px; min-width: 0; }
.hud b { display: block; font-size: 18px; font-weight: 750; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.phases { display: flex; gap: 6px; overflow-x: auto; margin-top: 10px; padding-bottom: 2px; }
.phases button { flex: 0 0 auto; }
.tools { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; align-items: center; }

/* fixes */
.fix { border-radius: 18px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); margin: 12px 0; overflow: hidden; }
.fix > summary { list-style: none; cursor: pointer; padding: 15px 16px; display: flex; gap: 12px; align-items: center; }
.fix > summary::-webkit-details-marker { display: none; }
.fix .n { width: 30px; height: 30px; flex: 0 0 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 14px; background: var(--work-soft); color: var(--work); }
.fix.polish .n { background: var(--ok-soft); color: var(--ok); }
.fix .ttl { flex: 1; min-width: 0; font-weight: 750; font-size: 16.5px; letter-spacing: -0.01em; line-height: 1.25; }
.fix .ttl small { display: block; font-weight: 600; font-size: 12.5px; color: var(--muted); letter-spacing: 0; margin-top: 2px; }
.fix .chev { color: var(--muted); transition: transform .2s; font-size: 18px; }
.fix[open] .chev { transform: rotate(90deg); }
.fix .body { padding: 0 16px 16px; }
.fix .body p { margin: 0 0 10px; }
.fix .lbl { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
.cue { background: var(--accent-soft); border-radius: 14px; padding: 12px 14px; margin: 4px 0 12px; }
.cue .lbl { color: var(--accent); }
.cue b { font-size: 16.5px; line-height: 1.35; font-weight: 700; display: block; }
.coachline { background: var(--soft); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; font-variant-numeric: tabular-nums; margin-bottom: 12px; }
.coachonly { display: none; }
body.coach .coachonly { display: block; }
body.coach .playeronly { display: none; }
.cat { padding: 12px 0; border-top: 1px solid var(--line); }
.cat:first-child { border-top: 0; padding-top: 2px; }
.cat summary { list-style: none; cursor: pointer; }
.cat summary::-webkit-details-marker { display: none; }
.cat .line { display: flex; align-items: baseline; gap: 8px; margin-bottom: 7px; }
.cat .line b { flex: 1; font-weight: 700; }
.cat .line .sc { font-weight: 800; font-variant-numeric: tabular-nums; }
.cat .bar > i.good { background: var(--good); } .cat .bar > i.ok { background: var(--ok); } .cat .bar > i.work { background: var(--work); }
.wins { list-style: none; margin: 0; padding: 0; }
.wins li { display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); align-items: flex-start; }
.wins li:first-child { border-top: 0; }
.wins li.coachonly { display: none; }
body.coach .wins li.coachonly { display: flex; }
.tick { width: 22px; height: 22px; flex: 0 0 22px; border-radius: 50%; background: var(--good-soft); color: var(--good); display: grid; place-items: center; font-size: 13px; font-weight: 800; margin-top: 1px; }
details.more > summary { cursor: pointer; font-weight: 700; padding: 4px 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <a class="brand" href="#/" aria-label="Tracer Tennis home"><img src="/static/logo-mark.png" alt="" width="48" height="34"><img class="word" src="/static/wordmark.png" alt="Tracer Tennis" width="121" height="30"></a>
  <nav><a href="#/new/swing">Swing</a><a href="#/new/lesson">Lesson</a><a href="#/new/match">Match</a></nav>
</header>
<main id="view"></main>

<script>
const $ = (sel, el = document) => el.querySelector(sel);
const view = $('#view');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (v, d = 1) => v === null || v === undefined ? '–' : (typeof v === 'number' ? (Number.isInteger(v) ? v : v.toFixed(d)) : esc(v));
const pctTxt = v => v === null || v === undefined ? '–' : v + '%';
const nice = s => esc(String(s).replace(/_/g, ' '));
let pollTimer = null;
let pickedCorners = null;

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) { let m = r.statusText; try { m = (await r.json()).detail || m; } catch (e) {} throw new Error(m); }
  return r.json();
}

// ---------- routing ----------
function route() {
  clearInterval(pollTimer);
  const h = location.hash || '#/';
  if (h.startsWith('#/new/')) return newJob(h.slice(6));
  if (h.startsWith('#/job/')) return showJob(h.slice(6));
  return home();
}
window.addEventListener('hashchange', route);

// ---------- home ----------
async function home() {
  const ico = {
    swing: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="14.5" cy="8.5" rx="5" ry="6.2" transform="rotate(35 14.5 8.5)"/><path d="M10.6 13.6 4 21"/><circle cx="19.5" cy="18.5" r="1.8"/></svg>',
    lesson: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2.5"/><path d="M9 4.5h6M8.5 11l2 2 4-4.5M8.5 17h7"/></svg>',
    match: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="3" width="15" height="18" rx="1.5"/><path d="M4.5 12h15M8 3v18M16 3v18M8 7.5h8M8 16.5h8M12 7.5v9"/></svg>'};
  const mode = (kind, title, text) => `<a class="card mode" href="#/new/${kind}"><span class="ico">${ico[kind]}</span><span class="txt"><span class="big">${title}</span><br><span class="muted small">${text}</span></span><span class="go" aria-hidden="true">›</span></a>`;
  view.innerHTML = `
    <div class="homehero"><div class="eyebrow" style="color:#9cc0ff">Video coaching</div><h1>See your game the way a coach does</h1>
      <p>Film on your iPhone. Get motion capture, clear fixes and the numbers behind them.</p></div>
    ${mode('swing', 'Swing analysis', 'One stroke at a time: feet, turn, contact and follow-through, with what to fix first.')}
    ${mode('lesson', 'Lesson', 'Every shot from a lesson: type, where it was hit from, where it landed, in or out.')}
    ${mode('match', 'Match or session', 'Singles or doubles: every player and shot, stats, positioning and strategy.')}
    <div id="phone"></div>
    <h2>Recent</h2><div id="recent" class="muted">Loading…</div>`;
  phoneCard();
  try {
    const jobs = await api('/api/jobs');
    $('#recent').innerHTML = jobs.length ? jobs.map(j => `
      <a class="card" href="#/job/${j.id}" style="padding:13px 16px"><div class="row spread"><b style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(j.title)}</b><span class="chip">${j.kind}</span></div>
      <div class="small muted">${new Date(j.created * 1000).toLocaleString()} · ${j.status === 'done' ? 'ready' : esc(j.status)}</div></a>`).join('')
      : 'Nothing yet. Upload a video to start.';
  } catch (e) { $('#recent').innerHTML = `<span class="err">${esc(e.message)}</span>`; }
}

// On the computer: show how to open the app on the phone. On the phone: show how to add it to the home screen.
async function phoneCard() {
  const onComputer = ['localhost', '127.0.0.1'].includes(location.hostname);
  const standalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
  const box = $('#phone');
  if (!box) return;
  if (onComputer) {
    let info;
    try { info = await api('/api/info'); } catch (e) { return; }
    if (!$('#phone')) return;
    box.innerHTML = info.urls.length ? `<h2>Use it on your iPhone</h2><div class="card"><div class="row wrap" style="align-items:flex-start">
        <img src="/api/qr" alt="QR code for ${esc(info.urls[0])}" width="150" height="150" style="border-radius:8px;background:#fff">
        <div style="flex:1;min-width:180px"><p>1. Put the iPhone on the same Wi-Fi as this computer.</p><p>2. Point the camera at the code and open the link.</p>
          <p>3. In Safari tap Share, then <b>Add to Home Screen</b>.</p><p class="small muted">Address: ${info.urls.map(esc).join(' or ')}</p></div></div>
        <p class="small muted">Videos are processed on this computer, so it has to be on with this app running.</p></div>`
      : `<div class="card small muted">This computer is not on a network, so a phone cannot reach it yet.</div>`;
  } else if (!standalone && /iPhone|iPad/.test(navigator.userAgent)) {
    box.innerHTML = `<div class="card small">Install it: tap <b>Share</b>, then <b>Add to Home Screen</b>. It then opens full screen like any other app.</div>`;
  }
}

// ---------- new job ----------
function heightSelects() {
  const ft = [4, 5, 6].map(f => `<option ${f === 5 ? 'selected' : ''}>${f}</option>`).join('');
  const inch = [...Array(12).keys()].map(i => `<option ${i === 7 ? 'selected' : ''}>${i}</option>`).join('');
  return `<div class="row"><select id="ft" aria-label="feet">${ft}</select><span>ft</span><select id="in" aria-label="inches">${inch}</select><span>in</span></div>`;
}
const heightCm = () => Math.round((+$('#ft').value * 12 + +$('#in').value) * 2.54);

function newJob(kind) {
  pickedCorners = null;
  const isMatch = kind !== 'swing', isLesson = kind === 'lesson';
  view.innerHTML = `
    <h1>${isLesson ? 'Lesson' : isMatch ? 'Match or session' : 'Swing analysis'}</h1>
    <p class="muted">${isLesson
      ? 'Prop the phone high behind the baseline with the whole court in view and leave it still. Mark the court below: in and out calls depend on it.'
      : isMatch
      ? 'Best results: phone on a tripod or fence mount, high behind the baseline, whole court in view, not moving.'
      : 'Best results: whole body in view, side-on or behind, 60 fps or slow-motion. Short clips process fastest.'}</p>
    <form id="f">
      <label for="video">Video</label>
      <input id="video" type="file" accept="video/*" required>
      ${isMatch ? `
        <label>Format</label>
        <div class="seg" id="fmt"><button type="button" class="ghost on" data-v="singles">Singles</button><button type="button" class="ghost" data-v="doubles">Doubles</button></div>
        <label>Players <span class="muted small">(near side first, left to right, then far side)</span></label>
        <div id="names" class="grid2"></div>
        <div id="courtStep" class="hide">
          <label>Mark the court <span class="muted small">(${isLesson ? 'needed for where shots land and in or out' : 'optional: unlocks placement, speeds, positioning, strategy'})</span></label>
          <p class="small muted" id="pickHint"></p>
          <canvas class="pick" id="pick"></canvas>
          <div class="row" style="margin-top:8px"><button type="button" class="ghost small" id="redo">Start over</button><span class="small muted" id="pickState"></span></div>
        </div>` : `
        <label>Hitting hand</label>
        <select id="hand"><option value="auto">Detect automatically</option><option value="right">Right</option><option value="left">Left</option></select>`}
      <label>Player height <span class="muted small">(sets the scale for speeds and distances)</span></label>
      ${heightSelects()}
      <p id="msg" class="err"></p>
      <button id="go" style="width:100%;margin-top:14px">Analyze</button>
    </form>`;
  if (isMatch) setupMatchForm(isLesson);
  $('#f').addEventListener('submit', async ev => {
    ev.preventDefault();
    const file = $('#video').files[0];
    if (!file) return;
    const fd = new FormData();
    fd.append('video', file); fd.append('kind', kind); fd.append('height_cm', heightCm()); fd.append('title', file.name);
    if (isMatch) {
      fd.append('format', $('#fmt .on').dataset.v);
      fd.append('names', [...document.querySelectorAll('#names input')].map(i => i.value.replace(/,/g, ' ')).join(','));
      if (pickedCorners && pickedCorners.length === 4) fd.append('corners', JSON.stringify(pickedCorners));
    } else fd.append('hand', $('#hand').value);
    $('#go').disabled = true; $('#go').textContent = 'Uploading…'; $('#msg').textContent = '';
    try { const r = await api('/api/jobs', {method: 'POST', body: fd}); location.hash = '#/job/' + r.id; }
    catch (e) { $('#msg').textContent = e.message; $('#go').disabled = false; $('#go').textContent = 'Analyze'; }
  });
}

function setupMatchForm(isLesson) {
  const drawNames = () => {
    const doubles = $('#fmt .on').dataset.v === 'doubles';
    const labels = doubles ? ['Near left', 'Near right', 'Far left', 'Far right']
      : isLesson ? ['Near side (e.g. student)', 'Far side (e.g. coach)'] : ['Near player', 'Far player'];
    $('#names').innerHTML = labels.map(l => `<input type="text" placeholder="${l}" aria-label="${l}" maxlength="40">`).join('');
  };
  $('#fmt').addEventListener('click', ev => {
    if (!ev.target.dataset.v) return;
    document.querySelectorAll('#fmt button').forEach(b => b.classList.toggle('on', b === ev.target));
    drawNames();
  });
  drawNames();
  const steps = ['far-left', 'far-right', 'near-right', 'near-left'];
  const canvas = $('#pick'), ctx = canvas.getContext('2d');
  let frame = null, pts = [];
  const redraw = () => {
    if (!frame) return;
    ctx.drawImage(frame, 0, 0, canvas.width, canvas.height);
    ctx.lineWidth = Math.max(2, canvas.width / 300); ctx.strokeStyle = '#ffe600'; ctx.fillStyle = '#ffe600';
    if (pts.length > 1) { ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0] * canvas.width, p[1] * canvas.height) : ctx.moveTo(p[0] * canvas.width, p[1] * canvas.height)); if (pts.length === 4) ctx.closePath(); ctx.stroke(); }
    pts.forEach(p => { ctx.beginPath(); ctx.arc(p[0] * canvas.width, p[1] * canvas.height, canvas.width / 90, 0, 7); ctx.fill(); });
    $('#pickHint').textContent = pts.length < 4 ? `Tap the ${steps[pts.length]} corner of the doubles court (outer lines).` : 'Court marked. It will be snapped to the painted lines.';
    $('#pickState').textContent = `${pts.length}/4`;
    pickedCorners = pts.length === 4 ? pts : null;
  };
  canvas.addEventListener('click', ev => {
    if (pts.length >= 4 || !frame) return;
    const r = canvas.getBoundingClientRect();
    pts.push([(ev.clientX - r.left) / r.width, (ev.clientY - r.top) / r.height]);
    redraw();
  });
  $('#redo').addEventListener('click', () => { pts = []; redraw(); });
  $('#video').addEventListener('change', () => {
    const file = $('#video').files[0];
    pts = []; frame = null; pickedCorners = null;
    if (!file) return;
    const v = document.createElement('video');
    v.muted = true; v.playsInline = true; v.preload = 'auto'; v.src = URL.createObjectURL(file);
    const grab = () => {
      if (!v.videoWidth) return;
      canvas.width = Math.min(v.videoWidth, 1280); canvas.height = Math.round(canvas.width * v.videoHeight / v.videoWidth);
      const off = document.createElement('canvas'); off.width = canvas.width; off.height = canvas.height;
      off.getContext('2d').drawImage(v, 0, 0, off.width, off.height);
      frame = off; $('#courtStep').classList.remove('hide'); redraw(); URL.revokeObjectURL(v.src);
    };
    v.addEventListener('loadeddata', () => { v.currentTime = Math.min(0.5, (v.duration || 1) / 2); });
    v.addEventListener('seeked', grab, {once: true});
    v.addEventListener('error', () => { $('#courtStep').classList.add('hide'); });
    v.play().then(() => v.pause()).catch(() => {});
  });
}

// ---------- job page ----------
async function showJob(id) {
  view.innerHTML = '<p class="muted">Loading…</p>';
  const tick = async () => {
    let job;
    try { job = await api('/api/jobs/' + id); } catch (e) { view.innerHTML = `<p class="err">${esc(e.message)}</p>`; clearInterval(pollTimer); return; }
    if (job.status === 'done') { clearInterval(pollTimer); return job.kind === 'swing' ? swingReport(job) : matchReport(job); }
    if (job.status === 'error') { clearInterval(pollTimer); view.innerHTML = `<h1>${esc(job.title)}</h1><div class="card"><p class="err">${esc(job.error)}</p><a href="#/new/${job.kind}">Try another video</a></div>`; return; }
    const p = Math.round((job.progress || 0) * 100);
    view.innerHTML = `<h1>${esc(job.title)}</h1><div class="card"><p><b>${job.status === 'queued' ? 'Waiting in line' : 'Analyzing'}</b> <span class="muted">${p}%</span></p>
      <div class="bar"><i style="width:${p}%"></i></div>
      <p class="small muted">Tracking ${job.kind === 'swing' ? 'the body and racket frame by frame' : 'players, ball and shots'}. You can leave this page and come back.</p></div>`;
  };
  await tick();
  pollTimer = setInterval(tick, 1500);
}

// ---------- shared video tools ----------
function viewMode() { try { return localStorage.getItem('tt-view') || 'player'; } catch (e) { return 'player'; } }
function setViewMode(mode) {
  try { localStorage.setItem('tt-view', mode); } catch (e) {}
  document.body.classList.toggle('coach', mode === 'coach');
  document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === mode));
}
function videoBlock(id, extra = '') {
  return `<video id="vid" controls playsinline preload="metadata" src="/files/${id}/overlay.mp4"></video>${extra}
    <div class="tools">
      ${[0.25, 0.5, 1].map(r => `<button class="ghost small rate ${r === 1 ? 'on' : ''}" data-r="${r}">${r === 1 ? 'Full speed' : r + '×'}</button>`).join('')}
      <button class="ghost small step" data-d="-1" aria-label="previous frame">◀</button>
      <button class="ghost small step" data-d="1" aria-label="next frame">▶</button>
    </div>`;
}
function setRate(rate) {
  const v = $('#vid');
  v.playbackRate = rate;
  document.querySelectorAll('.rate').forEach(x => x.classList.toggle('on', +x.dataset.r === rate));
}
function wireVideo(fps) {
  const v = $('#vid');
  document.querySelectorAll('.rate').forEach(b => b.addEventListener('click', () => setRate(+b.dataset.r)));
  document.querySelectorAll('.step').forEach(b => b.addEventListener('click', () => { v.pause(); v.currentTime = Math.max(0, v.currentTime + (+b.dataset.d) / fps); }));
  document.querySelectorAll('[data-seek]').forEach(el => el.addEventListener('click', () => {
    v.currentTime = Math.max(0, +el.dataset.seek); v.play(); v.scrollIntoView({behavior: 'smooth', block: 'center'}); }));
  document.querySelectorAll('[data-freeze]').forEach(el => el.addEventListener('click', () => { v.pause(); v.currentTime = Math.max(0, +el.dataset.freeze); }));
  document.querySelectorAll('[data-show]').forEach(el => el.addEventListener('click', () => {
    setRate(0.25); v.currentTime = Math.max(0, +el.dataset.show - 0.3); v.play(); v.scrollIntoView({behavior: 'smooth', block: 'center'}); }));
}

function lineChart(series, marks, height = 150) {
  // series: [{name, color, t:[], y:[]}], marks: [{t, label}]
  const W = 360, H = height + 20, pad = 26;
  const ts = series[0].t, t0 = ts[0], t1 = ts[ts.length - 1];
  const ymax = Math.max(1, ...series.flatMap(s => s.y.filter(v => v !== null))) * 1.08;
  const X = t => pad + (t - t0) / Math.max(t1 - t0, 1e-6) * (W - pad - 8), Y = v => H - 18 - v / ymax * (H - 30);
  const paths = series.map(s => {
    let d = '', pen = false;
    s.y.forEach((v, i) => { if (v === null) { pen = false; return; } d += `${pen ? 'L' : 'M'}${X(s.t[i]).toFixed(1)},${Y(v).toFixed(1)}`; pen = true; });
    return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
  }).join('');
  const lines = marks.map(m => `<line x1="${X(m.t)}" x2="${X(m.t)}" y1="22" y2="${H - 18}" stroke="currentColor" stroke-opacity=".3" stroke-dasharray="3 3"/>
    <text x="${X(m.t)}" y="${H - 4}" font-size="11" text-anchor="middle" fill="currentColor" opacity=".7">${esc(m.label)}</text>`).join('');
  const legend = series.map((s, i) => `<circle cx="${pad + 6 + i * 130}" cy="10" r="4" fill="${s.color}"/><text x="${pad + 14 + i * 130}" y="14" font-size="11" fill="currentColor">${esc(s.name)}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="speed over time"><text x="2" y="${Y(ymax / 1.08) + 4}" font-size="11" fill="currentColor" opacity=".7">${(ymax / 1.08).toFixed(0)}</text>${lines}${paths}${legend}</svg>`;
}

// ---------- swing report ----------
const SHOW_AT = {shoulder_turn: 'backswing_end', separation: 'backswing_end', back_foot_angle: 'backswing_end', knee_bend_dom: 'backswing_end',
  prep_time: 'backswing_end', racket_drop: 'forward_swing', follow_length: 'finish', finish_height: 'finish', back_foot_pivot: 'finish'};
const PHASES = [['takeback', 'Ready'], ['backswing_end', 'Racket back'], ['forward_swing', 'Swing'], ['contact', 'Contact'], ['finish', 'Finish']];
const MPH = 2.237;

function scoreRing(score) {
  const C = 2 * Math.PI * 46;
  return `<div class="ring"><svg viewBox="0 0 104 104" aria-hidden="true"><circle cx="52" cy="52" r="46" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="9"/>
    <circle class="fill" cx="52" cy="52" r="46" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${C.toFixed(1)}" data-to="${(C * (1 - score / 100)).toFixed(1)}"/></svg>
    <div class="num"><b>${score}</b><span>out of 100</span></div></div>`;
}

function birdsEye(td, which, status, byKey) {
  // Schematic seen from straight above. Up the page is toward the target; the chest side is to the right.
  const f = td[which], S = 175, W = 340, H = 330;
  const mid = [(f.feet[0].pos[0] + f.feet[1].pos[0]) / 2, (f.feet[0].pos[1] + f.feet[1].pos[1]) / 2];
  const gap = Math.hypot(f.feet[0].pos[0] - f.feet[1].pos[0], f.feet[0].pos[1] - f.feet[1].pos[1]);
  const spread = gap < 0.42 ? 0.42 / Math.max(gap, 0.05) : 1;      // keep the two shoes from overlapping when the feet are close
  const feet = f.feet.map(ft => ({...ft, pos: [mid[0] + (ft.pos[0] - mid[0]) * spread, mid[1] + (ft.pos[1] - mid[1]) * spread]}));
  const X = x => W / 2 + 10 + (x - mid[0]) * S, Y = y => H / 2 + 20 - (y - mid[1]) * S;
  const col = k => `var(--${({good: 'good', ok: 'ok', work: 'work'})[status[k]] || 'info'})`;
  const num = k => byKey[k] && typeof byKey[k].value === 'number' ? byKey[k].value : null;
  const shoe = ft => {
    const key = ft.front ? 'front_foot_angle' : (which === 'set' ? 'back_foot_angle' : 'back_foot_pivot');
    const deg = Math.atan2(ft.dir[0], ft.dir[1]) * 180 / Math.PI, cx = X(ft.pos[0]), cy = Y(ft.pos[1]);
    const off = Math.round(Math.acos(Math.max(-1, Math.min(1, ft.dir[1]))) * 180 / Math.PI);
    const left = ft.pos[0] < mid[0] || (ft.pos[0] === mid[0] && !ft.front);
    return `<g transform="translate(${cx.toFixed(1)} ${cy.toFixed(1)}) rotate(${deg.toFixed(1)}) scale(.78)">
        <path d="M-12 26 Q-14 -6 -9 -24 Q0 -40 9 -24 Q14 -6 12 26 Q0 33 -12 26 Z" fill="${col(key)}"/>
        <path d="M-7 -22 Q0 -33 7 -22" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="2.5" stroke-linecap="round"/></g>
      <text x="${(cx + (left ? -22 : 22)).toFixed(1)}" y="${(cy + 4).toFixed(1)}" font-size="11.5" font-weight="700" text-anchor="${left ? 'end' : 'start'}" fill="currentColor">${ft.front ? 'Front foot' : 'Back foot'}</text>
      <text x="${(cx + (left ? -22 : 22)).toFixed(1)}" y="${(cy + 19).toFixed(1)}" font-size="11" text-anchor="${left ? 'end' : 'start'}" fill="currentColor" opacity=".7">${off}° off target</text>`;
  };
  const turn = num(which === 'set' ? 'shoulder_turn' : 'shoulders_at_contact');
  let chest = '';
  if (turn !== null) {
    const a = turn * Math.PI / 180, nx = Math.sin(a), ny = Math.cos(a), cx = X(mid[0]), cy = Y(mid[1] + 0.03), half = 36;
    chest = `<line x1="${cx - ny * half}" y1="${cy - nx * half}" x2="${cx + ny * half}" y2="${cy + nx * half}" stroke="currentColor" stroke-opacity=".8" stroke-width="7" stroke-linecap="round"/>
      <line x1="${cx}" y1="${cy}" x2="${cx + nx * 26}" y2="${cy - ny * 26}" stroke="currentColor" stroke-opacity=".8" stroke-width="3" stroke-linecap="round"/>
      <text x="${cx + nx * 34 + (nx >= 0 ? 2 : -2)}" y="${cy - ny * 34 + 4}" font-size="11" font-weight="600" text-anchor="${nx >= 0.3 ? 'start' : nx <= -0.3 ? 'end' : 'middle'}" fill="currentColor" opacity=".75">chest</text>`;
  }
  let ball = '';
  const ahead = num('contact_in_front'), spacing = num('contact_spacing');
  if (which === 'contact' && ahead !== null && spacing !== null) {
    const front = feet.find(x => x.front), bx = X(Math.max(mid[0] + spacing / 100, front.pos[0] + 0.24)), by = Y(mid[1] + (front.pos[1] - mid[1]) * 0.5 + ahead / 100);
    ball = `<circle cx="${bx}" cy="${by}" r="9" fill="#d8ee3a" stroke="#7d8f00" stroke-width="1.2"/>
      <text x="${bx}" y="${by - 15}" font-size="11.5" font-weight="700" text-anchor="middle" fill="currentColor">Contact</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="feet, chest and contact point seen from above" style="max-width:360px;margin:0 auto">
    <line x1="26" y1="${H - 20}" x2="26" y2="36" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="5 5"/><path d="M26 18 L34 36 H18 Z" fill="var(--accent)"/>
    <text x="40" y="31" font-size="11.5" font-weight="700" fill="var(--accent)">To target</text>
    ${chest}${feet.map(shoe).join('')}${ball}
  </svg>`;
}

function fixCard(f, i, s, open) {
  const at = s.times[SHOW_AT[f.key] || 'contact'];
  return `<details class="fix ${f.severity === 'polish' ? 'polish' : ''} ${i >= 3 ? 'coachonly' : ''}" ${open ? 'open' : ''}>
    <summary><span class="n">${i + 1}</span><span class="ttl">${esc(f.title)}<small>${esc(f.category)}${f.severity === 'polish' ? ' · polish' : ''}${f.situational ? ' · partly the situation' : ''}</small></span><span class="chev" aria-hidden="true">›</span></summary>
    <div class="body">
      <div class="lbl">What we saw</div><p>${esc(f.saw)}</p>
      <div class="lbl">Why it matters</div><p>${esc(f.why)}</p>
      <div class="cue"><div class="lbl">Think</div><b>${esc(f.cue)}</b></div>
      <div class="lbl">Try this</div><p>${esc(f.drill)}</p>
      <div class="coachline coachonly"><b>Measured:</b> ${esc(f.measured)}${f.typical ? ` &nbsp;·&nbsp; <b>Typical:</b> ${esc(f.typical)}` : ''}</div>
      <button class="ghost small" data-show="${at.toFixed(3)}">Show me in slow motion</button>
    </div></details>`;
}

function swingReport(job) {
  const r = job.report, id = job.id;
  if (!r.swings.length) {
    view.innerHTML = `<h1>${esc(job.title)}</h1><div class="card"><p>No swing was found in this clip. The player was tracked, but the hand never moved fast enough to count as a stroke.</p></div>${videoBlock(id)}`;
    return wireVideo(r.video.fps);
  }
  let current = 0, eye = 'contact', hudTimer = null;
  const draw = () => {
    cancelAnimationFrame(hudTimer);
    const s = r.swings[current], c = s.coaching || null, status = Object.fromEntries(s.metrics.map(m => [m.key, m.status]));
    const byKey = Object.fromEntries(s.metrics.map(m => [m.key, m]));
    const kf = ['backswing_end', 'forward_swing', 'contact', 'finish'].map(k => [k, r.keyframes[`${s.index}:${k}`]]).filter(x => x[1]);
    const racket = r.series.racket_head_speed;
    const series = [{name: 'Hand (mph)', color: '#3d86ff', t: r.series.t, y: r.series.hand_speed.map(v => v * MPH)}];
    if (racket) series.push({name: 'Racket head (mph)', color: '#f2a93b', t: r.series.t, y: racket.map(v => v === null ? null : v * MPH)});
    const marks = [['backswing_end', 'racket back'], ['contact', 'contact']].map(([k, label]) => ({t: s.times[k], label}));
    const seqMax = Math.max(...s.sequence.map(q => Math.abs(q.ms_before_contact)), 1);
    const strokeName = s.stroke[0].toUpperCase() + s.stroke.slice(1) + (s.two_handed ? ', two-handed' : '');
    const phases = [...new Set(s.metrics.map(m => m.phase))];
    const stance = byKey.stance_type, step = byKey.step_in;
    view.innerHTML = `
      <div class="hero">
        <div class="top">${c && c.overall !== null ? scoreRing(c.overall) : ''}
          <div style="min-width:0"><div class="eyebrow">${esc(s.hand)}-handed${c ? ' · ' + esc(c.band) : ''}</div><h1>${esc(strokeName)}</h1>
          <div class="meta">${esc(job.title)} · ${r.video.fps} fps</div></div></div>
        ${c ? `<div class="headline">${esc(c.headline)}</div>${c.context ? `<div class="context">${esc(c.context)}</div>` : ''}` : ''}
      </div>
      <div class="seg" role="tablist" aria-label="Level of detail"><button data-view="player">Player view</button><button data-view="coach">Coach view</button></div>
      ${r.swings.length > 1 ? `<div class="phases">${r.swings.map((x, i) => `<button class="ghost small pickswing ${i === current ? 'on' : ''}" data-i="${i}">${i + 1}. ${esc(x.stroke)}${x.coaching && x.coaching.overall !== null ? ' · ' + x.coaching.overall : ''}</button>`).join('')}</div>` : ''}

      <h2>Watch it</h2>
      ${videoBlock(id, `<div class="phases">${PHASES.map(([k, label]) => `<button class="ghost small" data-freeze="${s.times[k].toFixed(3)}">${label}</button>`).join('')}</div>
        <div class="hud"><div><span class="eyebrow">Moment</span><b id="hudPhase">Ready</b></div><div><span class="eyebrow">Hand</span><b id="hudHand">0 mph</b></div><div><span class="eyebrow">Racket</span><b id="hudRacket">–</b></div></div>`)}
      <p class="small muted">White lines are the body. Blue is the hitting arm and the path of the hand. The white trail is the racket head. Arrows show where each foot points: green is good, amber or red needs attention.</p>

      ${c ? `<h2>${c.fixes.length ? 'What to work on' : 'Nothing to fix'}</h2>
        ${c.fixes.length ? c.fixes.map((f, i) => fixCard(f, i, s, i === 0)).join('') : '<div class="card"><p>Every checkpoint we measure came out in a good range on this swing.</p></div>'}
        ${c.fixes.length > 3 ? `<p class="small muted playeronly">Showing the three that matter most. Coach view lists all ${c.fixes.length} with the measurements.</p>` : ''}

        <h2>How each part scored</h2>
        <div class="card">${c.categories.map(cat => `<details class="cat"><summary><div class="line"><b>${esc(cat.name)}</b><span class="small muted">${cat.passed} of ${cat.checks} checks</span><span class="sc">${cat.score}</span></div>
          <div class="bar"><i class="${cat.score >= 85 ? 'good' : cat.score >= 60 ? 'ok' : 'work'}" style="width:${cat.score}%"></i></div></summary>
          <div style="margin-top:8px">${cat.keys.map(k => byKey[k]).map(m => `<div class="metric"><div class="row"><span class="dot s-${m.status}"></span><div class="lab small">${esc(m.label)}</div><div class="val small">${fmt(m.value)} ${esc(m.unit)}</div></div>
            <div class="small muted coachonly" style="margin-left:20px">${m.typical ? 'Typical ' + esc(m.typical) + '. ' : ''}${esc(m.note)}</div></div>`).join('')}</div></details>`).join('')}
          <p class="small muted" style="margin-top:10px">Tap a row to see what was checked.</p></div>` : `<div class="card"><p>This report was made with an older version. Upload the video again to get the coaching view.</p></div>`}

      ${s.topdown && s.topdown.contact ? `<h2>Feet and body from above</h2>
        <div class="card"><div class="seg" id="eye"><button data-eye="set" class="${eye === 'set' ? 'on' : ''}">Racket back</button><button data-eye="contact" class="${eye === 'contact' ? 'on' : ''}">Contact</button></div>
          <div id="eyeSvg" style="margin-top:8px"></div>
          <p><b>${stance ? esc(stance.value[0].toUpperCase() + stance.value.slice(1)) + ' stance.' : ''}</b> ${stance ? esc(stance.note) : ''}${step && typeof step.value === 'number' && step.value >= 8 ? ` You stepped ${Math.round(step.value / 2.54)} inches toward the target.` : ''}</p>
          <p class="small muted">A simplified picture built from the measured angles. Green means in a good range; amber or red needs attention.</p></div>` : ''}

      ${c && c.strengths.length ? `<h2>What you did well</h2><div class="card"><ul class="wins">${c.strengths.map((w, i) => `<li class="${i >= 6 ? 'coachonly' : ''}"><span class="tick" aria-hidden="true">✓</span><span>${esc(w.text)}</span></li>`).join('')}</ul></div>` : ''}

      <h2>Speed through the swing</h2><div class="card">${lineChart(series, marks)}
        <p class="small muted">A good swing is still gaining speed at the contact line and holds it just after.</p></div>
      ${kf.length ? `<h2>Key moments</h2><div class="strip">${kf.map(([k, f]) => `<figure><img loading="lazy" src="/files/${id}/${esc(f)}" alt="${nice(k)}"><figcaption>${esc((PHASES.find(p => p[0] === k) || [k, nice(k)])[1])}</figcaption></figure>`).join('')}</div>` : ''}

      <div class="coachonly">
        <h2>Kinetic chain</h2>
        <div class="card"><p class="small muted">When each segment reached top speed, in milliseconds before contact. Longer bar means earlier. The order should run hips, shoulders, arm, hand.</p>
          ${s.sequence.map(q => `<div class="row" style="margin:8px 0"><div style="width:84px" class="small">${esc(q.segment)}</div>
            <div class="bar" style="flex:1"><i style="width:${Math.max(3, Math.abs(q.ms_before_contact) / seqMax * 100)}%"></i></div>
            <div class="small" style="width:122px;text-align:right">${q.ms_before_contact} ms · ${fmt(q.peak)} ${esc(q.unit)}</div></div>`).join('')}</div>
        <h2>Every measurement</h2>
        ${phases.map(ph => `<div class="card"><h3>${esc(ph)}</h3>${s.metrics.filter(m => m.phase === ph).map(m => `
          <div class="metric"><div class="row"><span class="dot s-${m.status}"></span><div class="lab">${esc(m.label)}</div><div class="val">${fmt(m.value)} ${esc(m.unit)}</div></div>
          <div class="small muted" style="margin-left:20px">${m.typical ? 'Typical ' + esc(m.typical) + '. ' : ''}${esc(m.note)}</div></div>`).join('')}</div>`).join('')}
      </div>
      <details class="more card"><summary>How accurate is this?</summary><div class="small muted" style="margin-top:8px">${r.caveats.map(x => `<p>${esc(x)}</p>`).join('')}
        <p>The score is the share of checkpoints in a good range, weighted equally across the six areas. It is a guide for comparing your own swings, not a rating of your level.</p></div></details>`;
    wireVideo(r.video.fps);
    setViewMode(viewMode());
    document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => setViewMode(b.dataset.view)));
    document.querySelectorAll('.pickswing').forEach(b => b.addEventListener('click', () => { current = +b.dataset.i; draw(); window.scrollTo(0, 0); }));
    requestAnimationFrame(() => document.querySelectorAll('.ring circle.fill').forEach(el => el.setAttribute('stroke-dashoffset', el.dataset.to)));
    if (s.topdown && s.topdown.contact) {
      const paint = () => { $('#eyeSvg').innerHTML = birdsEye(s.topdown, eye, status, byKey); document.querySelectorAll('#eye button').forEach(b => b.classList.toggle('on', b.dataset.eye === eye)); };
      $('#eye').addEventListener('click', ev => { if (ev.target.dataset.eye) { eye = ev.target.dataset.eye; paint(); } });
      paint();
    }
    // live readouts that follow the video
    const v = $('#vid'), ts = r.series.t;
    const hud = () => {
      if (!document.body.contains(v)) return;
      const t = v.currentTime;
      let i = 0; while (i < ts.length - 1 && ts[i + 1] <= t) i++;
      let phase = 'Ready';
      for (const [k, label] of PHASES) if (t >= s.times[k] - 1e-3) phase = label;
      if (t > s.times.finish + 0.15) phase = 'Finish';
      $('#hudPhase').textContent = phase;
      $('#hudHand').textContent = Math.round(r.series.hand_speed[i] * MPH) + ' mph';
      $('#hudRacket').textContent = racket && racket[i] !== null ? Math.round(racket[i] * MPH) + ' mph' : '–';
      hudTimer = requestAnimationFrame(hud);
    };
    hud();
  };
  draw();
}

// ---------- match report ----------
function courtSvg(report, layer) {
  const DW = 5.485, SW = 4.115, L = 11.885, S = 6.4, pad = 2.6, k = 20;
  const W = (2 * DW + 2 * pad) * k, H = (2 * L + 2 * pad) * k;
  const X = x => (x + DW + pad) * k, Y = y => (L + pad - y) * k;
  const ln = (a, b) => `<line x1="${X(a[0])}" y1="${Y(a[1])}" x2="${X(b[0])}" y2="${Y(b[1])}" stroke="var(--court-line)" stroke-width="2"/>`;
  const lines = [[[-DW, L], [DW, L]], [[-DW, -L], [DW, -L]], [[-DW, -L], [-DW, L]], [[DW, -L], [DW, L]], [[-SW, -L], [-SW, L]], [[SW, -L], [SW, L]],
    [[-SW, S], [SW, S]], [[-SW, -S], [SW, -S]], [[0, -S], [0, S]]].map(([a, b]) => ln(a, b)).join('');
  const color = Object.fromEntries(report.players.map(p => [p.id, p.color]));
  let marks = '';
  for (const p of report.players) {
    const sum = report.shot_summary[p.id];
    if (layer === 'landings') marks += sum.landings.map(m => `<circle cx="${X(m.x)}" cy="${Y(m.y)}" r="6" fill="${color[p.id]}" stroke="#000" stroke-opacity=".4"${m.result !== 'in' && m.result !== 'unknown' ? ' fill-opacity=".25"' : ''}/>`).join('');
    if (layer === 'contacts') marks += sum.hit_positions.map(m => `<rect x="${X(m.x) - 5}" y="${Y(m.y) - 5}" width="10" height="10" fill="${color[p.id]}" stroke="#000" stroke-opacity=".4"/>`).join('');
    if (layer === 'movement' && report.movement) marks += report.movement[p.id].positions.map(q => `<circle cx="${X(q[0])}" cy="${Y(q[1])}" r="4" fill="${color[p.id]}" fill-opacity=".28"/>`).join('');
  }
  return `<svg viewBox="0 0 ${W} ${H}" style="max-width:340px;margin:0 auto" role="img" aria-label="court map"><rect width="${W}" height="${H}" rx="10" fill="var(--court)"/>${lines}
    <line x1="${X(-DW - .9)}" y1="${Y(0)}" x2="${X(DW + .9)}" y2="${Y(0)}" stroke="#111" stroke-width="3"/>${marks}
    <text x="${W / 2}" y="${H - 8}" font-size="13" text-anchor="middle" fill="var(--court-line)">camera end</text></svg>`;
}

function shotLabel(s) {
  if (s.contact === 'serve' || s.contact === 'overhead') return nice(s.contact);
  const stroke = s.stroke === 'unknown' ? '' : nice(s.stroke);
  return `${stroke} ${s.contact === 'groundstroke' ? '' : nice(s.contact)}`.trim() || 'shot';
}
function mocapLine(metrics) {
  const short = {hand_speed_peak: 'hand speed', contact_height: 'contact height', swing_path: 'swing path', elbow_contact: 'elbow'};
  return Object.keys(short).filter(k => metrics[k] && metrics[k].value !== null).map(k => `${short[k]} ${fmt(metrics[k].value)} ${esc(metrics[k].unit)}`).join(' · ');
}

function tallyTable(title, groups, first) {
  const rows = Object.entries(groups);
  if (!rows.length) return '';
  return `<h3 style="margin-top:14px">${title}</h3><div class="scroll"><table class="tight">
    <tr><th>${first}</th><th class="num">Shots</th><th class="num">In</th><th class="num">Net</th><th class="num">Long</th><th class="num">Wide</th><th class="num">In %</th></tr>
    ${rows.map(([k, v]) => `<tr><td>${nice(k)}</td><td class="num">${v.shots}</td><td class="num">${v.made}</td><td class="num">${v.net}</td><td class="num">${v.long}</td><td class="num">${v.wide}</td><td class="num">${pctTxt(v.in_pct)}</td></tr>`).join('')}
  </table></div>`;
}
function lessonSection(r) {
  const calibrated = r.mode === 'calibrated';
  return `<h2>Lesson breakdown</h2>
    ${calibrated ? '' : '<div class="card small muted">The court was not marked (or the camera moved), so shots are counted and classified but landing spots and in or out are not available.</div>'}
    ${r.players.map(p => { const L = r.lesson[p.id], t = L.total;
      if (!t.shots) return `<div class="card"><h3><span class="dot" style="background:${p.color}"></span> ${esc(p.name)}</h3><p class="muted">No shots seen.</p></div>`;
      return `<div class="card"><h3><span class="dot" style="background:${p.color}"></span> ${esc(p.name)}</h3>
        <p><span class="big">${t.shots}</span> shots${t.judged ? ` · <b>${t.made} of ${t.judged}</b> in (${pctTxt(t.in_pct)})` : ''}${t.not_seen ? ` · <span class="muted">${t.not_seen} landing${t.not_seen === 1 ? '' : 's'} not seen</span>` : ''}</p>
        ${L.most_common_miss ? `<p class="small muted">Most common miss: ${nice(L.most_common_miss)}.</p>` : ''}
        ${tallyTable('By shot type', L.by_kind, 'Shot')}
        ${tallyTable('By where it was hit from', L.by_hit_zone, 'Position')}
        ${tallyTable('By landing depth (balls that went in)', L.by_depth, 'Depth')}</div>`; }).join('')}
    <p class="small muted">In and out are estimates from one camera. A ball within about 12 cm of a line counts as in. "Not seen" means the bounce was not detected, usually because it was hidden or too close to the next hit.</p>`;
}

function statRows(stats, rows) {
  const t = stats.teams;
  return rows.map(([label, f]) => `<tr><td>${label}</td><td class="num">${f(t['0'])}</td><td class="num">${f(t['1'])}</td></tr>`).join('');
}

function matchReport(job) {
  const r = job.report, id = job.id;
  const color = Object.fromEntries(r.players.map(p => [p.id, p.color]));
  const calibrated = r.mode === 'calibrated';
  let layer = 'landings';
  const shots = r.rallies.flatMap(x => x.shots);
  const recs = r.recommendations || [];
  const st = r.stats;
  const teamName = t => r.players.filter(p => p.team === t).map(p => esc(p.name)).join(' / ');
  const posAll = r.positioning_all_rallies;
  view.innerHTML = `
    <h1>${esc(job.title)}</h1>
    <p><span class="chip">${esc(r.format)}</span> <span class="chip">${calibrated ? 'court calibrated' : 'no court calibration'}</span>
       <span class="chip">ball seen ${r.tracking.ball_seen_pct}% of frames</span></p>
    ${r.warnings.map(w => `<div class="card small"><span class="chip warn">note</span> ${esc(w)}</div>`).join('')}
    ${videoBlock(id)}
    <p class="small muted">${r.players.map(p => `<span class="dot" style="background:${p.color}"></span> ${esc(p.name)}`).join(' &nbsp; ')}</p>

    ${r.lesson ? lessonSection(r) : ''}
    <div class="${r.lesson ? 'hide' : ''}">
    <h2>Where to stand and what to play</h2>
    ${recs.length ? recs.map(x => `<div class="card rec p${x.priority}"><h3>${esc(x.title)}</h3><p class="small muted">${esc(x.evidence)}</p><p>${esc(x.advice)}</p></div>`).join('')
      : `<div class="card small muted">${calibrated
          ? 'Not enough scored points in this video for evidence-based advice. Positioning measured so far is below; a full set gives far more to work with.'
          : 'Positioning and strategy advice needs positions in metres. Film from a fixed spot behind the baseline with the whole court in view and mark the four corners when you upload.'}</div>`}
    ${posAll ? `<div class="card"><h3>Positioning when the opponent hits</h3><div class="scroll"><table>
        <tr><th>Player</th><th class="num">At net</th><th class="num">No-man's land</th><th class="num">Baseline</th><th class="num">Deep</th><th class="num">Off ideal spot</th></tr>
        ${r.players.map(p => { const z = posAll.players[p.id].zones, rc = posAll.players[p.id].recovery, g = n => pctTxt(z[n] ? z[n].share_pct : 0);
          return `<tr><td>${esc(p.name)}</td><td class="num">${g('net')}</td><td class="num">${g('no_mans_land')}</td><td class="num">${g('baseline')}</td><td class="num">${g('deep_behind')}</td><td class="num">${rc.avg_error_m === null ? '–' : rc.avg_error_m + ' m'}</td></tr>`; }).join('')}
      </table></div><p class="small muted">"Off ideal spot" is the average sideways distance from the best recovery position at the moment the opponent makes contact (singles, baseline rallies).</p></div>` : ''}
    </div>

    <h2>Shots</h2>
    <div class="card">${shots.length ? r.rallies.map(ra => `<div class="small muted" style="margin-top:6px">${r.lesson ? 'Sequence' : 'Rally'} ${ra.n} · ${ra.shots.length} shot${ra.shots.length === 1 ? '' : 's'}</div>
      ${ra.shots.map(s => `<div class="shot" data-seek="${Math.max(0, s.t - 1).toFixed(2)}"><span class="t">${s.t.toFixed(1)}s</span><span class="dot" style="background:${color[s.player]}"></span>
        <div style="flex:1"><b>${esc(s.name)}</b> ${shotLabel(s)}
          ${s.unsure_player ? '<span class="chip warn">check player</span>' : ''}
          ${s.mocap ? `<div class="small muted">${mocapLine(s.mocap.metrics)}</div>${s.mocap.tip ? `<div class="small"><b>Fix:</b> ${esc(s.mocap.tip.title)}. <span class="muted">${esc(s.mocap.tip.cue)}</span></div>` : ''}` : ''}</div>
        <span class="small">${r.lesson ? (s.result === 'unknown' ? '' : `<b>${s.result === 'in' ? 'in' : nice(s.result)}</b>`) : (s.result === 'in' || s.result === 'unknown' ? '' : nice(s.result))} ${s.speed_kmh ? Math.round(s.speed_kmh * 0.621) + ' mph' : ''}</span></div>`).join('')}`).join('')
      : '<p class="muted">No shots were detected.</p>'}
      <p class="small muted">Tap a shot to jump the video to it.</p></div>

    <h2>Players</h2>
    <div class="grid2">${r.players.map(p => { const s = r.shot_summary[p.id], mv = r.movement && r.movement[p.id], se = r.session[p.id];
      return `<div class="card"><h3><span class="dot" style="background:${p.color}"></span> ${esc(p.name)}</h3>
        <p><b>${s.shots}</b> shots ${Object.entries(s.by_stroke).filter(([k]) => k !== 'unknown').map(([k, v]) => `<span class="chip">${v} ${nice(k)}</span>`).join(' ')}
          ${Object.entries(s.by_contact).filter(([k]) => !['groundstroke', 'serve'].includes(k)).map(([k, v]) => `<span class="chip">${v} ${nice(k)}</span>`).join(' ')}</p>
        ${s.avg_speed_kmh ? `<p class="small">Avg shot speed ${Math.round(s.avg_speed_kmh * 0.621)} mph, top ${Math.round(s.max_speed_kmh * 0.621)} mph</p>` : ''}
        ${mv ? `<p class="small">Ran ${mv.distance_m} m${mv.max_speed_kmh ? `, top speed ${Math.round(mv.max_speed_kmh * 0.621)} mph` : ''}</p>` : ''}
        ${se.swings_measured ? `<p class="small muted">Mocap on ${se.swings_measured} swing${se.swings_measured === 1 ? '' : 's'}: ${['hand_speed_peak', 'contact_height', 'swing_path', 'elbow_contact', 'knee_bend_dom'].filter(k => se.metrics[k]).map(k => `${esc(se.metrics[k].label.split(/[,(:]/)[0].toLowerCase())} ${fmt(se.metrics[k].mean)} ${esc(se.metrics[k].unit)}`).join(' · ')}</p>` : ''}</div>`; }).join('')}</div>

    ${calibrated ? `<h2>Court map</h2><div class="card"><div class="seg" id="layers">
        <button class="ghost small on" data-l="landings">Landings</button><button class="ghost small" data-l="contacts">Contact points</button><button class="ghost small" data-l="movement">Movement</button></div>
        <div id="court" style="margin-top:10px"></div><p class="small muted">Faded landing marks were out or in the net.</p></div>` : ''}

    ${st ? `<h2>Match stats</h2>
      <div class="card"><p class="big">${esc(st.overview.score || 'In progress')}</p>
        <p class="small muted">${st.overview.points} points · average rally ${fmt(st.overview.avg_rally)} shots · longest ${st.overview.longest_rally}</p>
        <div class="scroll"><table><tr><th></th><th class="num">${teamName(0)}</th><th class="num">${teamName(1)}</th></tr>
        ${statRows(st, [
          ['Points won', t => `${t.points.won} (${pctTxt(t.points.won_pct)})`], ['Winners', t => t.points.winners], ['Unforced errors', t => t.points.unforced_errors],
          ['Forced errors', t => t.points.forced_errors], ['1st serve in', t => pctTxt(t.serve.first_serve_in_pct)], ['Won on 1st serve', t => pctTxt(t.serve.first_serve_won_pct)],
          ['Won on 2nd serve', t => pctTxt(t.serve.second_serve_won_pct)], ['Aces', t => t.serve.aces], ['Double faults', t => t.serve.double_faults],
          ['Return points won', t => pctTxt(t.ret.points_won_pct)], ['Break points won', t => `${t.ret.break_points_converted}/${t.ret.break_points_chances}`],
          ['Net points won', t => `${pctTxt(t.net.won_pct)} of ${t.net.points}`], ['Short rallies (0-4) won', t => pctTxt(t.rally['0-4'].won_pct)],
          ['Long rallies (9+) won', t => pctTxt(t.rally['9+'].won_pct)], ['Distance run', t => t.movement.distance_m + ' m']])}
        </table></div></div>
      ${st.insights.length ? `<div class="card"><h3>What decided it</h3>${st.insights.map(x => `<p>${esc(x)}</p>`).join('')}</div>` : ''}` : ''}
    ${r.review && r.review.length ? `<h2>Rallies not scored</h2><div class="card small">${r.review.map(x => `<p><b>${x.t_start}s</b>: ${esc(x.reason)} (${x.shots} shots)</p>`).join('')}
      <p class="muted">A point is scored automatically only when the serve is seen and the ending is clear.</p></div>` : ''}`;
  wireVideo(r.tracking.analysis_fps);
  if (calibrated) {
    const paint = () => { $('#court').innerHTML = courtSvg(r, layer); };
    $('#layers').addEventListener('click', ev => { if (!ev.target.dataset.l) return; layer = ev.target.dataset.l;
      document.querySelectorAll('#layers button').forEach(b => b.classList.toggle('on', b === ev.target)); paint(); });
    paint();
  }
}

route();
</script>
</body>
</html>
